name: CI

on:
  push:
    branches: [master, main, 'claude/**']
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build needs DATABASE_URL to generate Prisma client but not a real DB
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost/mathspark' }}
          SEED_SECRET: ${{ secrets.SEED_SECRET || 'ci-placeholder' }}
          NEXT_TELEMETRY_DISABLED: 1

      # E2E tests (require DATABASE_URL with seeded data — run locally or in staging)
      # To run: npm run e2e
